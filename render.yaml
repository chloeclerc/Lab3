databases:
  - name: poolridesdb
    plan: free
    databaseName: poolrides
    user: poolrides

services:
  - type: web
    plan: free
    name: poolrides
    runtime: python
    rootDir: Lab3
    buildCommand: './build.sh'
    startCommand: 'gunicorn HandyRides.wsgi:application'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: poolridesdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
